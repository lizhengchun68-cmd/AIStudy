# Build and run contract tests on Windows (MSVC), matching local dev workflow.
name: CI

on:
  push:
    branches:
      - main
      - master
      - zcli/fea_dev
  pull_request:
    branches:
      - main
      - master
      - zcli/fea_dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC / ctest
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DAISTUDY_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
